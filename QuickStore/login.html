<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — QuickStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header__inner">
            <a href="index.html" class="logo">QuickStore</a>
            <nav class="nav" aria-label="Navegação principal">
                <a href="index.html">Início</a>
                <a href="cadastro.html">Cadastro</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="auth-card" aria-labelledby="login-titulo">
            <div class="auth-card__header">
                <h1 id="login-titulo">Entrar</h1>
                <p class="auth-card__subtitle">Acesse sua conta para acompanhar pedidos e finalizar compras.</p>
            </div>

            <form class="auth-form" action="/api/login" method="POST">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn--primary">Entrar</button>
            </form>

            <p class="auth-card__footer">
                Não tem conta? <a href="cadastro.html">Cadastre-se</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 QuickStore. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
