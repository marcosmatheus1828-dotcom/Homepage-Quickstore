<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickStore - Loja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <header class="topo-loja">
    <div class="header_inner">
      <a href="index.html" class="logo">QuickStore</a>
      <nav class="nav">
        <a href="index.html">Início</a>
        <a href="loja.html" class="nav_active">Loja</a>
        <a href="cadastro.html">Cadastro</a>
      </nav>
    </div>
  </header>

  
  <main class="corpo-loja">
    <section class="secao-produtos">
      <h2>Produtos Disponíveis</h2>

      <article class="card-fone">
        <a href="fone.html" class="link-produto">
          <div class="container-imagem">
            <!-- Substitua pelo caminho correto da sua imagem -->
            <img src="fone.jpg" alt="Fone de Ouvido" class="img-fone">
          </div>
          <div class="info-fone">
            <h3>Fone Bluetooth</h3>
            <p class="preco-fone">R$ 89.90</p>
            <span class="btn-ver-detalhes">Ver Detalhes</span>
          </div>
        </a>
      </article>
    </section>
  </main>

</body>
</html>
